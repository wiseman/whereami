<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>whereami</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%232f81f7' fill-opacity='.25'/><circle cx='8' cy='8' r='3' fill='%232f81f7'/></svg>">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb"
        crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>whereami</h1>
    <span id="status" class="status" data-state="idle">starting…</span>
    <nav class="actions">
      <button id="btn-pause" type="button" aria-pressed="false">Pause</button>
      <button id="btn-follow" type="button" aria-pressed="true">Follow</button>
      <button id="btn-awake" type="button" aria-pressed="false" hidden>Keep awake</button>
      <button id="btn-export" type="button">CSV</button>
      <button id="btn-clear" type="button">Clear</button>
    </nav>
  </header>

  <main class="layout">
    <div id="map" class="map"></div>

    <section class="panel">
      <dl class="readout" id="readout">
        <div class="cell wide"><dt>lat, lon</dt><dd><button id="r-latlon" class="copy" type="button" title="Copy to clipboard">—</button></dd></div>
        <div class="cell"><dt>accuracy</dt><dd id="r-acc">—</dd></div>
        <div class="cell"><dt>altitude</dt><dd id="r-alt">—</dd></div>
        <div class="cell"><dt>alt accuracy</dt><dd id="r-altacc">—</dd></div>
        <div class="cell"><dt>speed</dt><dd id="r-speed">—</dd></div>
        <div class="cell"><dt>heading</dt><dd id="r-heading">—</dd></div>
        <div class="cell"><dt>fix age</dt><dd id="r-age">—</dd></div>
        <div class="cell"><dt>fix time</dt><dd id="r-time">—</dd></div>
        <div class="cell"><dt>fixes</dt><dd id="r-count">0</dd></div>
      </dl>

      <div class="log">
        <table>
          <thead>
            <tr>
              <th>time</th>
              <th>Δt s</th>
              <th>lat</th>
              <th>lon</th>
              <th>acc m</th>
              <th>alt m</th>
              <th>±alt</th>
              <th>m/s</th>
              <th>hdg</th>
            </tr>
          </thead>
          <tbody id="log"></tbody>
        </table>
        <p id="log-empty" class="empty">Waiting for the first fix…</p>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"
          crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
